name: contract tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m pytest -q
      - run: node --test tests/archive_loader.test.mjs
      - run: python3 tests/rebuild_index.py --check
