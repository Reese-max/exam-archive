name: contract tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m pytest tests/test_archive_contract.py -q
      - run: node --test tests/archive_loader.test.mjs
      - run: python3 tests/rebuild_index.py --check
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements-browser.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_smoke.py
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m pytest tests/test_practice_a11y.py -q
